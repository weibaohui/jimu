[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
# 共享接口包
jimu-plugin-interface = { path = "../../jimu-plugin-interface" }

# Web 框架
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

# 插件加载
libloading = "0.8"

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "mysql", "sqlite", "any"] }

# 工具
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
time = "0.3"

# 压缩/解压插件包
flate2 = "1.0"
tar = "0.4"
base64 = "0.21"

# 全局静态变量
once_cell = "1"
