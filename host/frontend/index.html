<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宿主系统</title>
    <!-- process 全局 polyfill：插件 JS 中可能包含 process.env 引用（如 react-jsx-runtime.development.js） -->
    <script>window.process = { env: { NODE_ENV: 'production' } }</script>
    <!-- Import Map：让插件 JS 中的 bare import 能正确解析为 Vite 预构建的本地 dep -->
    <script type="importmap">
    {
      "imports": {
        "react": "/node_modules/.vite/deps/react.js",
        "react-dom": "/node_modules/.vite/deps/react-dom.js",
        "antd": "/node_modules/.vite/deps/antd.js"
      }
    }
    </script>
    <!-- 预加载 React、ReactDOM 和 antd，并作为全局变量暴露给插件 -->
    <script type="module">
      import * as React from '/node_modules/.vite/deps/react.js'
      import * as ReactDOM from '/node_modules/.vite/deps/react-dom.js'
      import * as antd from '/node_modules/.vite/deps/antd.js'
      import { PlusOutlined, EditOutlined, DeleteOutlined } from '@ant-design/icons'
      
      // 将 React、ReactDOM 和 antd 暴露为全局变量，供插件使用
      window.React = React
      window.ReactDOM = ReactDOM
      window.antd = antd
      window.__ANT_DESIGN_ICONS__ = { PlusOutlined, EditOutlined, DeleteOutlined }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
